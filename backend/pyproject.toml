[project]
name = "ai-drama"
version = "0.1.0"
description = "AI short-drama / comic-drama production platform — backend core (CLI + FastAPI)."
readme = "README.md"
authors = [
    { name = "nblog" }
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "sqlalchemy>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
]

[project.optional-dependencies]
routin = [
    "agentscope>=2.0.2",
    "agent-framework-openai>=1.8.1",
    "volcengine-python-sdk[ark]>=4.0.0",
]

[project.scripts]
ai-drama = "ai_drama.cli.app:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
