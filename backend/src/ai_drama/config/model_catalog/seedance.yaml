family: seedance
display_name: "Seedance (即梦)"
provider: mulerouter
routing_prefixes:
  - seedance/seedance-
  - seedance-2.0-
supported_backends:
  - routin
default_backend: routin
credential_sources:
  routin:
    - ROUTIN_API_KEY
supported_modalities:
  - t2v
  - i2v
  - r2v
models:
  - id: seedance/seedance-2.0-video
    display_name: Seedance 2.0
    description: ByteDance Seedance 2.0 video generation
    runtime:
      routin:
        gateway: routin
    modes:
      t2v:
        legacy_id: seedance-2.0-t2v
        display_name: Seedance 2.0 T2V
        description: Text-to-video generation
        capabilities: [t2v]
        duration:
          type: slider
          min: 4
          max: 15
          step: 1
          default: 15
        params:
          prompt:
            maxLength: 2000
          ratio:
            options: ["9:16", "16:9", "1:1"]
            default: "9:16"
          resolution:
            options: [480p, 720p, 1080p]
            default: 720p
          seed: true
          negativePrompt: false
          promptExtend: false
          watermark: true
      i2v:
        legacy_id: seedance-2.0-i2v
        display_name: Seedance 2.0 I2V
        description: Image-to-video generation
        capabilities: [i2v]
        duration:
          type: slider
          min: 4
          max: 15
          step: 1
          default: 15
        params:
          prompt:
            maxLength: 1000
          ratio:
            options: ["9:16", "16:9", "1:1"]
            default: "9:16"
          resolution:
            options: [480p, 720p, 1080p]
            default: 720p
          seed: true
          negativePrompt: false
          promptExtend: false
          watermark: true
        inputs:
          reference_images:
            max: 1
            reference_type: image
      r2v:
        legacy_id: seedance-2.0-r2v
        display_name: Seedance 2.0 R2V
        description: Reference-to-video with multi-image input
        capabilities: [r2v]
        duration:
          type: slider
          min: 4
          max: 15
          step: 1
          default: 15
        params:
          prompt:
            maxLength: 2000
          ratio:
            options: ["9:16", "16:9", "1:1"]
            default: "9:16"
          resolution:
            options: [480p, 720p, 1080p]
            default: 720p
          seed: true
          negativePrompt: false
          promptExtend: false
          watermark: true
        inputs:
          reference_images:
            max: 9
            reference_type: image
